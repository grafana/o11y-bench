server:
  http_listen_port: 3200
  grpc_listen_port: 9095

memberlist:
  join_members: []
  bind_addr:
    - 127.0.0.1
  bind_port: 7947
  advertise_addr: 127.0.0.1
  abort_if_cluster_join_fails: false

querier:
  frontend_worker:
    frontend_address: 127.0.0.1:9095

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317
  ring:
    kvstore:
      store: inmemory

metrics_generator:
  ring:
    kvstore:
      store: inmemory
    instance_addr: 127.0.0.1
    instance_interface_names: []
  metrics_ingestion_time_range_slack: 72h
  processor:
    service_graphs:
      dimensions: []
    span_metrics:
      dimensions: []
  storage:
    path: /var/tempo/generator/wal
    remote_write: []

storage:
  trace:
    backend: local
    blocklist_poll: 1s
    wal:
      path: /var/tempo/wal
    block:
      # Tempo 3.1 defaults to dedicated columns for http.route, http.status_code and others, and
      # tag discovery (search tags, tag values) then misses those attributes. Keep them generic.
      parquet_dedicated_columns: []
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    global:
      max_bytes_per_trace: 50000000
    ingestion:
      burst_size_bytes: 200000000
      rate_limit_bytes: 150000000
    metrics_generator:
      max_active_series: 100000
      processors:
        - service-graphs
        - span-metrics

# Everything the generator ingests is flushed to the backend before the stack is ready, so
# queries read blocks only (no live-store/backend split, no trailing-edge cutoff) and
# results do not depend on how recently the data was written.
live_store:
  fail_on_high_lag: false
  flush_check_period: 1s
  max_trace_idle: 1s
  max_block_duration: 5s
  wal:
    # Block start/end times only expand to spans within this slack of real wall-clock
    # time. Backdated benchmark scenarios can sit days/weeks in the past, so keep this
    # generous — otherwise blocks claim a narrow time range and search filters them out.
    ingestion_time_range_slack: 720h

query_frontend:
  query_end_cutoff: 0s
  mcp_server:
    enabled: true
  max_retries: 2
  search:
    max_duration: 72h
    query_backend_after: 0s
  metrics:
    max_duration: 72h
    query_backend_after: 0s
