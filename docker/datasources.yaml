apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    orgId: 1
    url: http://localhost:9090
    basicAuth: false
    isDefault: true
    version: 1
    editable: true
    jsonData:
      # Seeded to a 30s scrape interval so edit-prometheus-scrape-interval has a real change to make.
      timeInterval: "30s"

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    orgId: 1
    url: http://localhost:3100
    basicAuth: false
    isDefault: false
    version: 1
    editable: true
    # No derivedFields seeded: edit-loki-derived-fields adds the trace_id -> Tempo derived field.

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    orgId: 1
    url: http://localhost:3200
    basicAuth: false
    isDefault: false
    version: 1
    editable: true
    jsonData:
      # No tracesToLogsV2 / lokiSearch seeded: edit-tempo-traces-to-logs wires the Tempo -> Loki correlation.
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
