name: CI Environment
description: Install uv, Python, optional mise, and sync dependencies

inputs:
  save-cache:
    description: Save uv cache after the job completes
    required: false
    default: "false"
  install-mise:
    description: Install mise for jobs that run `mise run`
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install uv and Python
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true
        cache-python: true
        python-version: "3.14"
        save-cache: ${{ inputs.save-cache }}

    - name: Install mise
      uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      if: ${{ inputs.install-mise == 'true' }}
      with:
        cache: false
        install: false

    - name: Install project dependencies
      run: uv sync --locked --all-groups
      shell: bash
