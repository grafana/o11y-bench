name: CI Environment
description: Install uv, Python, optional mise, and sync dependencies

inputs:
  save-cache:
    description: Save uv cache after the job completes
    required: false
    default: "false"
  install-mise:
    description: Install mise for jobs that run `mise run`
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install uv and Python
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        enable-cache: true
        cache-python: true
        python-version: "3.14"
        save-cache: ${{ inputs.save-cache }}

    - name: Install mise
      uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      if: ${{ inputs.install-mise == 'true' }}
      with:
        cache: false
        install: false

    - name: Install project dependencies
      run: uv sync --locked --all-groups
      shell: bash
