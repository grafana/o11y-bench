name: CI Environment
description: Install uv, Python, optional mise, and sync dependencies

inputs:
  save-cache:
    description: Save uv cache after the job completes
    required: false
    default: "false"
  install-mise:
    description: Install mise for jobs that run `mise run`
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install uv and Python
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        enable-cache: true
        cache-python: true
        python-version: "3.14"
        save-cache: ${{ inputs.save-cache }}

    - name: Install mise
      uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      if: ${{ inputs.install-mise == 'true' }}
      with:
        cache: false
        install: false

    - name: Install project dependencies
      run: uv sync --locked --all-groups
      shell: bash
