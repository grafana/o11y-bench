id: payment-error-blast-radius
category: investigation
tags:
- investigation
- logs
- metrics
- payment
- order
statement: |
  Over roughly the last six hours, did the payment incident mostly stay in payment-service or did
  it clearly spill into order-service too? Give me the rough combined 5xx rate for payment-service
  and order-service together (the share of their requests that returned 5xx), say whether payment-service looks primary, and mention whether
  order-service looks like spillover.
checks: []
rubric:
- criterion: The final response states the combined payment-service and order-service 5xx share within 5% of the truth.
  weight: 55
  fact:
    kind: query
    backend: prometheus
    query: sum(rate(http_requests_total{status=~"5..",job=~"payment-service|order-service"}[6h])) / sum(rate(http_requests_total{job=~"payment-service|order-service"}[6h]))
- criterion: The final response identifies payment-service as the primary incident source on its 5xx share, which the Source of truth puts well above order-service's, rather than treating the two as equal co-primary failures; noting order-service's similar raw 5xx count is fine
  weight: 20
  fact:
    kind: query
    backend: prometheus
    query: sum by (job) (rate(http_requests_total{status=~"5..",job=~"payment-service|order-service"}[6h])) / sum by (job) (rate(http_requests_total{job=~"payment-service|order-service"}[6h]))
- criterion: The final response treats order-service's 5xx as secondary to payment-service's (spillover, knock-on, or minor background errors), not as an equal failure of its own
  weight: 15
