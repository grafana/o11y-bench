id: dependency-outage-false-lead
category: investigation
tags:
- incident
- dependency
- logs
- traces
- root-cause
statement: |
  During order failures we're seeing 500s at the api-gateway. Is the gateway itself the problem,
  or is something behind it failing and this is just how it shows up to users? Ground what you say
  in roughly the last several hours of telemetry. If trace search informed your take, mention one
  trace id you actually saw (any prefix length you are comfortable sharing is fine).
checks: []
rubric:
- criterion: The final response places the failures' origin in payment-service or order-service, the backends that carry the 5xx in the Source of truth (payment-service by share, order-service by count), rather than in the gateway or user-service, and explains why api-gateway errors are downstream of that failure
  weight: 40.0
  fact:
    kind: query
    backend: prometheus
    query: sum by (job) (increase(http_requests_total{status=~"5..",job=~"user-service|order-service|payment-service"}[6h])) / sum by (job) (increase(http_requests_total{job=~"user-service|order-service|payment-service"}[6h]))
- criterion: The response frames gateway errors as downstream of a backend or upstream failure (in this sim, span errors originate at target services)
  weight: 10.0
