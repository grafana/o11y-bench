# This task evaluates whether an agent can correctly describe the rate at which the payment retry backlog
# drained after an incident. In order to succeed, the agent must
#   - understand that the relevant metric is a gauge rather than a counter, and consequently must choose
#     gauge-appropriate metrics, such as deriv() or delta() rather than rate()
#   - understand that the answer must use a positive value to describe a rate of decrease (drain rate)
#     rather than using a negative value to describe a rate of change
#   - understand that the change is relative to the peak, and therefore must correctly identify the peak
#     to be able to accurately answer the query

id: promql-retry-drain-rate
category: prometheus_query
tags:
- promql
- gauge
- deriv
- backlog
- drain
statement: |
  The payment retry backlog peaked and then recovered after the incident. Once it started
  draining, roughly how fast was the payment-service backlog shrinking (items per minute), and
  about how long did the drain take from peak back to zero? I want the drain speed, not just
  the peak.
checks: []
rubric:
# A rate() or increase() on this gauge reads every drop as a counter reset and reports a large
# positive rate while the backlog drains, so it fails the speed criterion on sign and size.
- criterion: The final response states how fast the payment-service backlog drained, in items per
    minute, matching any value in the Source of truth (the steepest 10-minute drain rate, the
    peak-to-zero average, or the average from the peak to the last non-zero reading, before
    the series drops to zero in one step)
  weight: 50
  fact:
    kind: query
    backend: prometheus
    query: label_replace(min_over_time(deriv(service_retry_queue_depth{job="payment-service"}[10m])[3h:1m]) * -60, "measure", "steepest_10m_drain_per_min", "", "") or label_replace(max_over_time(service_retry_queue_depth{job="payment-service"}[3h]) / ((max_over_time(timestamp(service_retry_queue_depth{job="payment-service"} > 0)[3h:1m]) - max_over_time((timestamp(service_retry_queue_depth{job="payment-service"}) and service_retry_queue_depth{job="payment-service"} == max_over_time(service_retry_queue_depth{job="payment-service"}[3h]))[3h:1m])) / 60 + 1), "measure", "peak_to_zero_average_per_min", "", "") or label_replace((max_over_time(service_retry_queue_depth{job="payment-service"}[3h]) - last_over_time((service_retry_queue_depth{job="payment-service"} > 0)[3h:1m])) / ((max_over_time(timestamp(service_retry_queue_depth{job="payment-service"} > 0)[3h:1m]) - max_over_time((timestamp(service_retry_queue_depth{job="payment-service"}) and service_retry_queue_depth{job="payment-service"} == max_over_time(service_retry_queue_depth{job="payment-service"}[3h]))[3h:1m])) / 60), "measure", "peak_to_last_nonzero_average_per_min", "", "")
- criterion: The final response states the payment-service backlog peak depth accurately
  weight: 20
  fact:
    kind: query
    backend: prometheus
    query: max_over_time(service_retry_queue_depth{job="payment-service"}[3h])
- criterion: The final response's drain duration, from peak back to zero, matches the Source of
    truth, minutes from the peak sample to the first zero
  weight: 30
  fact:
    kind: query
    backend: prometheus
    query: (max_over_time(timestamp(service_retry_queue_depth{job="payment-service"} > 0)[3h:1m]) - max_over_time((timestamp(service_retry_queue_depth{job="payment-service"}) and service_retry_queue_depth{job="payment-service"}
      == max_over_time(service_retry_queue_depth{job="payment-service"}[3h]))[3h:1m])) / 60 + 1
