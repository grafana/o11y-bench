id: query-cpu-metrics
category: prometheus_query
tags:
- promql
- metrics
- cpu
statement: |
  Checkout has felt sluggish for the last six hours or so. Compare average CPU across the monitored
  jobs over the last 6 hours, up to now: rank them from hottest to coolest, say about how much CPU
  the hottest one was burning on average, and tell me whether backend CPU looks like the main
  culprit or a weak lead for the slowdown.
checks: []
rubric:
- criterion: The final response states the average CPU of the hottest job (the top row of the Source of truth).
  weight: 50
  fact:
    kind: query
    backend: prometheus
    query: sum by (job) (rate(process_cpu_seconds_total{job=~".+"}[6h]))
- criterion: The final response ranks the monitored jobs from hottest to coolest in the order of the Source of truth. Jobs within 2% of each other in the Source of truth are tied, so any order among them is right, and the response says when the leaders are that close instead of presenting one as a clear winner.
  weight: 30
  fact:
    kind: query
    backend: prometheus
    query: sort_desc(sum by (job) (rate(process_cpu_seconds_total{job=~".+"}[6h])))
