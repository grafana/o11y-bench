id: list-services-traces
category: tempo_query
tags:
- traces
- tempo
- services
statement: |
  Over roughly the last day of data in the environment, which services actually have tracing coverage - who shows up?
  Split them into edge layers versus backend services, and don't forget any of the traced services.
checks: []
rubric:
- criterion: The final response names every service in the Source of truth as traced, and no service that
    is not in it.
  weight: 20.0
  fact:
    kind: query
    backend: tempo
    query: '{ } | count_over_time() by (resource.service.name)'
    lookback_hours: 24
- criterion: The final response separates webapp and api-gateway from the backend services instead of
    presenting one flat undifferentiated list
  weight: 10.0
