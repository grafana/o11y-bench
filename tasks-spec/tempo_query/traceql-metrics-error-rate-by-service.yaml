id: traceql-metrics-error-rate-by-service
category: tempo_query
tags:
- traceql
- metrics
- rate
- errors
- topk
statement: |
  Over the last day, which service looks worst for errors on POST /api/payments? I want the
  name, a trace id if you find one, and whatever numbers or examples make the case.
checks:
- weight: 40
  type: grounding
  params:
    prefix_min_chars: 8
    mode: trace_id
  name: Response cites a trace ID that appears in tool results
- name: The final response cites a failed POST /api/payments trace by its full ID
  weight: 10
  type: state
  params:
    mode: cited_trace
    match: '{ span.http.route = "/api/payments" && status = error }'
rubric:
- criterion: The final response explains, with span or metric evidence, that payment-service has the highest
    erroring-span rate on POST /api/payments
  weight: 10.0
  fact:
    kind: query
    backend: tempo
    query: '{ span.http.route = "/api/payments" && status = error } | rate() by (resource.service.name)'
- criterion: The response identifies payment-service as the service whose spans fail on POST /api/payments
  weight: 25.0
  fact:
    kind: query
    backend: tempo
    query: '{ span.http.route = "/api/payments" && status = error } | select(name, resource.service.name)'
    limit: 10
