id: traceql-tail-latency-bottleneck
category: tempo_query
tags:
- traceql
- latency
- tail
- bottleneck
statement: |
  Order flow sometimes spikes into ugly tail latency. Show me a concrete slow example: where
  does the time go, and which downstream piece looks like the bottleneck? Please include the
  trace id for the slow example if you find one.
checks:
- name: The final response cites a slow order-service checkout trace by its full ID
  weight: 10
  type: state
  params:
    mode: cited_trace
    match: '{ resource.service.name = "order-service" && name = "handle POST /api/orders" && duration
      > 300ms }'
rubric:
- criterion: Span durations the final response states for its example trace agree with that trace in the Source of truth
  weight: 20
  fact:
    kind: cited_trace
- criterion: The span the final response blames for its example trace's time is the span with the most own time in the Source of truth; blaming a downstream call that is short there, or stopping at an edge span, fails
  weight: 35
  fact:
    kind: cited_trace
