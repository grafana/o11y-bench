id: traceql-cross-service-analysis
category: tempo_query
tags:
- traceql
- traces
- cross-service
- latency
- rca
statement: |
  Slow checkout: I'm focused on POST /api/orders taking over a second end-to-end. When you
  dig into those slow requests, which service is eating the time? Does the same hotspot show up
  across several slow examples or is it all over the place? Include a trace id for one concrete
  slow example.
checks:
- name: The final response cites a POST /api/orders trace over one second by its full ID
  weight: 10
  type: state
  params:
    mode: cited_trace
    match: '{ name = "POST /api/orders" && duration > 1s }'
rubric:
- criterion: The response names order-service as the backend handling the slow POST /api/orders requests
  weight: 15.0
  fact:
    kind: query
    backend: tempo
    query: '{ name = "POST /api/orders" && duration > 1s }'
    limit: 10
- criterion: The span the final response blames for its example trace's time is the span with the most own time in the Source of truth; blaming a downstream call that is short there, or stopping at an edge span, fails
  weight: 15
  fact:
    kind: cited_trace
- criterion: Whether the final response says the hotspot shows up on most slow requests or only some agrees
    with the slow traces in the Source of truth
  weight: 10
  fact:
    kind: query
    backend: tempo
    query: '{ name = "POST /api/orders" && duration > 1s } >> { resource.service.name = "order-service"
      && name = "handle POST /api/orders" } | select(duration)'
    limit: 20
- criterion: Other services or hops the final response names on its example trace's slow path are among that trace's services in the Source of truth
  weight: 10
  fact:
    kind: cited_trace
