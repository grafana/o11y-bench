id: traceql-checkout-p99-by-service
category: tempo_query
tags:
- traceql
- metrics
- quantile
- latency
- checkout
statement: |
  Checkout on POST /api/orders has been dragging. Over roughly the last six hours, which backend
  service behind the api-gateway has the worst p99 duration for its server span on that route - the
  full time the service takes to handle the request, including the calls it waits on, not short
  nested spans - and roughly what p99 does the telemetry show?
rubric:
- criterion: The final response states order-service's p99 on POST /api/orders (its row in the Source of truth) within 20% of the truth; TraceQL metrics and span samples estimate a p99 differently.
  weight: 55
  fact:
    kind: query
    backend: tempo
    query: '{ span.http.route = "/api/orders" && kind = server } | quantile_over_time(duration, .99) by (resource.service.name)'
    lookback_hours: 6
- criterion: The final response names order-service as the backend with the worst request-handling p99 on POST /api/orders. webapp and api-gateway are edge layers whose spans wrap it, so they do not count as the backend
  weight: 15.0
  fact:
    kind: query
    backend: tempo
    query: '{ span.http.route = "/api/orders" && kind = server } | quantile_over_time(duration, .99) by (resource.service.name)'
    lookback_hours: 6
- criterion: Satisfied if **either** (a) the final response cites numeric tail latency from the investigation (p95, p99, histogram quantile, or similar), **or** (b) it cites concrete span durations from trace data - each tied to which service was worst at tails
  weight: 15.0
