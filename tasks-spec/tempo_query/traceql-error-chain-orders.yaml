id: traceql-error-chain-orders
category: tempo_query
tags:
- traceql
- errors
- traces
- service-chain
- tempo
statement: |
  Can you pull a failing POST /api/orders trace from roughly the last day? I'd love a trace id if
  you have one, how the request moved through services, and where it first looks wrong.
checks:
- name: The final response cites a failed POST /api/orders trace by its full ID
  weight: 10
  type: state
  params:
    mode: cited_trace
    match: '{ span.http.route = "/api/orders" && status = error }'
rubric:
- criterion: The path through services the final response describes for its example trace matches that trace's parent-child order in the Source of truth
  weight: 25
  fact:
    kind: cited_trace
- criterion: Where the final response says its example request first failed is that trace's error origin in the Source of truth, named by its operation or its service, and it treats webapp and api-gateway spans as only relaying the failed HTTP response
  weight: 30
  fact:
    kind: cited_trace
