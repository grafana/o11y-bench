id: traceql-cache-refresh-hotspot
category: tempo_query
tags:
- traceql
- traces
- cache
- user-service
- latency
statement: |
  User-profile requests have been slowing down, but I want the trace-level hotspot rather than a
  general service summary. Looking at slow GET /api/users traces from roughly the last day, which
  operation inside user-service keeps eating the time, and does that same hotspot show up in
  most slow requests or only some of them? Include one trace id you actually saw.
checks:
- name: The final response cites a slow GET /api/users trace by its full ID
  weight: 10
  type: state
  params:
    mode: cited_trace
    match: '{ resource.service.name = "user-service" && span.http.route = "/api/users" && duration > 500ms
      }'
rubric:
- criterion: The final response identifies the `refresh auth cache` span (or an equivalent auth-cache
    refresh operation) inside user-service as the dominant hotspot on slow GET `/api/users` traces, rather
    than stopping at only a generic service-level summary
  weight: 25
  fact:
    kind: query
    backend: tempo
    query: '{ span.http.route = "/api/users" && duration > 500ms } > { name = "refresh auth cache" }'
    limit: 10
- criterion: The final response's conclusion on whether the hotspot recurs across most slow GET /api/users
    requests or only some agrees with the Source of truth, which lists every slow user-service GET /api/users
    request and, under each, its `refresh auth cache` span when it has one
  weight: 15
  fact:
    kind: query
    backend: tempo
    query: '({ resource.service.name = "user-service" && span.http.route = "/api/users" && kind = server
      && duration > 500ms } > { name = "refresh auth cache" }) || { resource.service.name = "user-service"
      && span.http.route = "/api/users" && kind = server && duration > 500ms } | select(name, duration)'
    limit: 50
