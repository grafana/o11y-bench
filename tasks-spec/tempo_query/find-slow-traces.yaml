id: find-slow-traces
category: tempo_query
tags:
- traces
- tempo
- latency
- performance
statement: Anything in our traces pointing to unusually slow checkout (POST /api/orders) or payment (POST /api/payments) requests? Which services keep showing up in those slow requests? I care about what shows up across roughly the last day of traffic, not a tiny recent slice. Please include a trace id for one concrete slow example if you find one.
checks:
- name: The final response cites a slow checkout or payment trace by its full ID
  weight: 10
  type: state
  params:
    mode: cited_trace
    match: '{ name =~ "handle POST /api/(orders|payments)" && duration > 300ms }'
rubric:
- criterion: 'The final response identifies the backend carrying the slow requests on each path it reports,
    as the Source of truth shows: order-service''s `handle POST /api/orders` for checkout and payment-service''s
    `handle POST /api/payments` for payments, not only the webapp or api-gateway relays'
  weight: 25
  fact:
    kind: query
    backend: tempo
    query: '{ resource.service.name =~ "order-service|payment-service" && name =~ "handle POST /api/(orders|payments)"
      && duration > 300ms } | select(resource.service.name, name)'
    limit: 20
- criterion: The services the final response says keep showing up in the slow requests are the services
    of the slow traces in the Source of truth
  weight: 15
  fact:
    kind: query
    backend: tempo
    query: '{ resource.service.name =~ "order-service|payment-service" && name =~ "handle POST /api/(orders|payments)"
      && duration > 300ms } | select(resource.service.name, name)'
    limit: 20
- criterion: The final response's read of its example slow trace agrees with the Source of truth on its duration and on the span with the most own time
  weight: 15
  fact:
    kind: cited_trace
