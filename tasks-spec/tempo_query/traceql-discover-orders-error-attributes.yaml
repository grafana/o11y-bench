id: traceql-discover-orders-error-attributes
category: tempo_query
tags:
- traceql
- discovery
- attributes
- errors
- orders
statement: |
  Orders are failing on POST /api/orders. Walk me through one failed request end-to-end - what
  services show up, what failed first, and what fields in the trace actually tell you that? Please
  include the trace id for the failed request.
checks:
- name: The final response cites a failed POST /api/orders trace by its full ID
  weight: 10
  type: state
  params:
    mode: cited_trace
    match: '{ span.http.route = "/api/orders" && status = error }'
rubric:
- criterion: The services the final response names for its example trace are that trace's services in the Source of truth
  weight: 15
  fact:
    kind: cited_trace
- criterion: Where the final response says its example request first failed is that trace's error origin in the Source of truth, named by its operation or its service, and it treats webapp and api-gateway spans as only relaying the failed HTTP response
  weight: 30
  fact:
    kind: cited_trace
- criterion: The trace fields the final response points to as showing the failure (span status, HTTP status code) agree with the failing spans of its example trace in the Source of truth
  weight: 20
  fact:
    kind: cited_trace
