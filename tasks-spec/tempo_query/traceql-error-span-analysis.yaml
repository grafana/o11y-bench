id: traceql-error-span-analysis
category: tempo_query
tags:
- traceql
- traces
- errors
- span
- tempo
statement: |
  Where are we seeing error spans in distributed traces over roughly the last day? Which services
  show up and what operations are failing? If you can point to a specific trace - pasting an id is
  perfect - I can follow up on it myself.
checks:
- name: The final response cites a trace with an error span by its full ID
  weight: 10
  type: state
  params:
    mode: cited_trace
    match: '{ status = error }'
rubric:
- criterion: The final response names at least one failing operation that has error status in the traces
    (for example a `handle ...` span on order-service, payment-service or user-service, or a `call <service>`
    span), and does not present webapp or api-gateway spans as the ones in error
  weight: 25.0
  fact:
    kind: query
    backend: tempo
    query: '{ status = error } | select(name, resource.service.name)'
    limit: 20
- criterion: The services the final response says show error spans are ones whose spans have error status
    in the Source of truth
  weight: 15
  fact:
    kind: query
    backend: tempo
    query: '{ status = error } | select(name, resource.service.name)'
    limit: 20
