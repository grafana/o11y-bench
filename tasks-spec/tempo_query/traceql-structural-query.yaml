id: traceql-structural-query
category: tempo_query
tags:
- traceql
- traces
- structural
- parent-child
- tempo
statement: |
  When someone goes through checkout, what does order-service call underneath it? Name the
  downstream pieces you see, walk me through the call chain / parent-child flow, and flag any
  that look unusually slow. Include a trace id for one concrete trace if you find one.
checks:
- weight: 50
  type: grounding
  params:
    prefix_min_chars: 8
    mode: trace_id
  name: Response cites a trace ID that appears in tool results
- name: The final response cites an order-service checkout trace by its full ID
  weight: 10
  type: state
  params:
    mode: cited_trace
    match: '{ resource.service.name = "order-service" && name = "handle POST /api/orders" }'
rubric:
- criterion: The final response names user-service or payment-service (the services order-service calls)
    as downstream of order-service
  weight: 25
  fact:
    kind: query
    backend: tempo
    query: '{ resource.service.name = "order-service" && name =~ "handle .*" } > { } | select(name, resource.service.name)'
    limit: 20
- criterion: The call chain the final response walks through for its example trace matches that trace's parent-child order in the Source of truth, including the downstream calls order-service makes
  weight: 25
  fact:
    kind: cited_trace
- criterion: Downstream call durations the final response states for its example trace agree with that trace in the Source of truth
  weight: 10
  fact:
    kind: cited_trace
- criterion: The final response says which downstream calls look unusually slow, and each one it flags is
    slow against the typical checkout call durations in the Source of truth (median and p95 per call); when
    none is, it says no downstream call looks unusually slow
  weight: 10
  fact:
    kind: query
    backend: tempo
    query: '{ resource.service.name = "order-service" && name = "handle POST /api/orders" } > { } | quantile_over_time(duration,
      .5, .95) by (name, resource.service.name)'
