id: explain-postgres-tls-options
category: datasource_config
tags:
- datasource
- postgres
- learn
- tls
setup_datasources:
- uid: postgres
  name: PostgreSQL
  type: grafana-postgresql-datasource
  access: proxy
  url: db.internal:5432
  user: grafana
  database: analytics_db
  jsonData:
    sslmode: disable
    postgresVersion: 1500
statement: |
  What are the SSL/TLS options for a PostgreSQL data source and which should I use?
rubric:
- criterion: The response explains the PostgreSQL TLS/SSL mode options (the requested outcome)
  weight: 25
- criterion: Lists the sslmode options (disable, require, verify-ca, verify-full) and what each one does
  weight: 25
- criterion: Recommends verify-full for production because it validates the server certificate and hostname
  weight: 20
- criterion: Notes that verify-ca and verify-full require supplying the CA certificate
  weight: 15
- criterion: References that the example source currently uses sslmode 'disable', which provides no encryption
  weight: 15
  fact:
    kind: resource
    resource: datasource_detail
    name: PostgreSQL
