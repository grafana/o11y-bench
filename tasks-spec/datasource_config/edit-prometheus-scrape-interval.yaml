id: edit-prometheus-scrape-interval
category: datasource_config
tags:
- datasource
- prometheus
- edit
- scrape-interval
statement: |
  Our Prometheus data source still assumes a 30s scrape interval, but we moved to 15s scrapes.
  Update it.
checks:
- weight: 40
  type: state
  params:
    mode: datasource_detail
    name: Prometheus
    type: prometheus
    json_data:
    - path: timeInterval
      equals: 15s
  name: Prometheus datasource scrape interval is now 15s
rubric:
- criterion: The final response updates the Prometheus scrape interval setting (the requested outcome)
  weight: 20
  fact:
    kind: resource
    resource: datasource_detail
    name: Prometheus
- criterion: Identifies the scrape interval (timeInterval) setting, currently 30s, as the field to change
  weight: 15
- criterion: Sets the scrape interval to 15s to match the new scrape cadence
  weight: 15
- criterion: Explains this controls the minimum query step / $__interval lower bound
  weight: 5
- criterion: Leaves other connection settings (URL, access mode) unchanged
  weight: 5
