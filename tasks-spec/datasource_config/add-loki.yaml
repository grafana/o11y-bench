id: add-loki
category: datasource_config
tags:
- datasource
- loki
- add
statement: |
  Add a Loki data source at http://loki.monitoring.svc:3100 for our logs.
checks:
- weight: 40
  type: state
  params:
    mode: datasource_detail
    type: loki
    url_contains: loki.monitoring.svc:3100
    exclude_uids:
    - loki
  name: A Loki datasource exists pointing at loki.monitoring.svc:3100
rubric:
- criterion: The final response configures a new Loki data source pointing at http://loki.monitoring.svc:3100 (the requested outcome)
  weight: 20
  fact:
    kind: resource
    resource: datasource_inventory
- criterion: Selects the Loki data source type and sets the URL to http://loki.monitoring.svc:3100 with proxy (server) access
  weight: 20
- criterion: Mentions the maximum lines (maxLines) setting that caps how many log lines a query returns
  weight: 15
- criterion: Describes derived fields to extract a trace ID from log lines and link to a Tempo data source for trace correlation
  weight: 15
- criterion: Covers authentication options for securing the connection
  weight: 10
