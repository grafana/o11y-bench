id: edit-loki-derived-fields
category: datasource_config
tags:
- datasource
- loki
- edit
- derived-fields
statement: |
  Add a derived field on our Loki data source that pulls trace_id out of log lines and links to
  Tempo.
checks:
- weight: 40
  type: state
  params:
    mode: datasource_detail
    name: Loki
    type: loki
    json_data:
    - path: derivedFields
      present: true
    - path: derivedFields
      contains: tempo
  name: Loki datasource has a derived field linking trace_id to Tempo
rubric:
- criterion: The final response adds a derived field for trace correlation to the Loki data source (the requested outcome)
  weight: 20
  fact:
    kind: resource
    resource: datasource_detail
    name: Loki
- criterion: Adds a derived field with a regex matcher that extracts trace_id from the log line
  weight: 20
- criterion: Sets the derived field to link to the Tempo data source via an internal link (datasourceUid)
  weight: 15
  fact:
    kind: resource
    resource: datasource_inventory
- criterion: Names the field (for example TraceID) so it surfaces as a link in the log detail view
  weight: 10
- criterion: Preserves the existing connection settings
  weight: 10
