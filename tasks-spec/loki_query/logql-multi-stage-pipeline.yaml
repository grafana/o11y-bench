id: logql-multi-stage-pipeline
category: loki_query
tags:
- logql
- logs
- pipeline
- parsing
- advanced
statement: |
  Over the last six hours, which API endpoints look slowest in our request logs? Call out the
  worst paths and give a few real examples with how long they took.
checks: []
rubric:
- criterion: The final response states Max observed duration_ms accurately.
  weight: 45
  fact:
    kind: query
    backend: loki
    query: max(max_over_time({job=~".+"} | json | unwrap duration_ms | __error__="" [6h]))
- criterion: The final response names the slowest API paths, led by the top path in the Source of truth, which ranks paths by p95 request duration.
  weight: 30.0
  fact:
    kind: query
    backend: loki
    query: topk(3, quantile_over_time(0.95, {job=~".+"} | json | path=~".+" | unwrap duration_ms | __error__="" [6h]) by (path))
- criterion: The response cites numeric durations
  weight: 25.0
