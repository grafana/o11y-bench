id: logql-deployment-rollout-events
category: loki_query
tags:
- logql
- json
- deployments
- events
statement: 'Which services logged a v2.5.0 deployment over roughly the last day, and about when did each
  one land?

  '
checks: []
rubric:
- criterion: The final response states Count of v2.5.0 deployment log lines accurately.
  weight: 45
  fact:
    kind: query
    backend: loki
    query: sum(count_over_time({job=~".+"} |= "v2.5.0" |= "deployment" [24h]))
- criterion: The final response names every service that logged a v2.5.0 deployment in the Source of truth,
    and no other
  weight: 30
  fact:
    kind: query
    backend: loki
    query: sum by (job) (count_over_time({job=~".+"} |= "v2.5.0" |= "deployment" [24h]))
- criterion: The response includes the approximate deployment time, or a close relative time, tied to
    the rollout itself rather than only the search window
  weight: 20.0
