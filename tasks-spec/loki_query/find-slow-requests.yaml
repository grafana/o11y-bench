id: find-slow-requests
category: loki_query
tags:
- logql
- logs
- latency
- performance
statement: |
  Over the last six hours, are our HTTP request logs showing a really slow outlier? If so, which request or route is it, and roughly how slow did it get?
checks: []
rubric:
- criterion: The final response states Slow-request signal accurately.
  weight: 55
  fact:
    kind: query
    backend: loki
    query: max(max_over_time({job=~".+"} | json | unwrap duration_ms | __error__="" [6h]))
- criterion: The final response names the route of the slowest request, as the Source of truth ranks it
  weight: 20
  fact:
    kind: query
    backend: loki
    query: topk(1, max by (path) (max_over_time({job=~".+"} | json | unwrap duration_ms | __error__=""
      [6h])))
